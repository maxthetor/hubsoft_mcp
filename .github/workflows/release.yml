name: Release
# Publica uma release automaticamente quando a versão do package.json muda na main.
# Para lançar uma versão: altere "version" no package.json (e no manifest.json) e faça push.
# Também pode ser disparado manualmente em Actions → Release → Run workflow.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ler versão e verificar se já foi publicada
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          M="v$(node -p "require('./manifest.json').version")"
          C="v$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$V" != "$M" ] || [ "$V" != "$C" ]; then
            echo "::error::Versões diferentes: package.json=$V manifest.json=$M plugin.json=$C"; exit 1
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V já existe — nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.skip != 'true'
        run: npm ci && npm test

      - name: Gerar extensão .mcpb e pacote da skill
        if: steps.ver.outputs.skip != 'true'
        run: |
          npx -y @anthropic-ai/mcpb pack . hubsoft-mcp.mcpb
          (cd skills && zip -qr ../hubsoft-skill.zip hubsoft)

      - if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: hubsoft-mcp ${{ steps.ver.outputs.tag }}
          files: |
            hubsoft-mcp.mcpb
            hubsoft-skill.zip
          generate_release_notes: true
