name: Release
# Publique uma versão criando uma tag: git tag v0.2.0 && git push --tags
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gerar extensão .mcpb (só dependências de produção)
        run: |
          npm prune --omit=dev
          npx -y @anthropic-ai/mcpb pack . hubsoft-mcp.mcpb
      - uses: softprops/action-gh-release@v2
        with:
          files: hubsoft-mcp.mcpb
          generate_release_notes: true
